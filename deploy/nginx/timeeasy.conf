# Example nginx site for Creative Operations / TimeEasy.
#
# Assumptions:
# - `npm run build` has copied the built app to /var/www/timeeasy/dist.
# - The Node workspace API is running locally:
#   cd /opt/timeeasy
#   HOST=127.0.0.1 PORT=4173 TIMETRACKR_WORKSPACE_DB=/var/lib/timeeasy/workspace.sqlite npm run serve
# - TLS can be added with certbot or your preferred certificate automation.

upstream timeeasy_workspace_api {
  server 127.0.0.1:4173;
  keepalive 16;
}

server {
  listen 80;
  server_name timeeasy.example.com;

  root /var/www/timeeasy/dist;
  index index.html;
  client_max_body_size 3m;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  location /api/ {
    proxy_pass http://timeeasy_workspace_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
